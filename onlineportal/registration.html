<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | SkillVerse Academy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0b1220, #111827, #0f172a);
    min-height: 100vh;
    color: white;
}

/* Navbar */
.navbar {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.navbar-brand {
    color: #38bdf8 !important;
    font-weight: bold;
}

/* Form Card */
.glass-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Title */
.title {
    text-align: center;
    color: #7dd3fc;
    font-weight: bold;
    margin-bottom: 25px;
}

/* Inputs */
.form-control,
.form-select {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
}

.form-control::placeholder {
    color: #cbd5e1;
}

.form-control:focus,
.form-select:focus {
    box-shadow: 0 0 12px #38bdf8;
    border-color: #38bdf8;
    background: rgba(255,255,255,0.15);
    color: white;
}

/* Labels */
label {
    margin-bottom: 5px;
    color: #cbd5e1;
}

/* Button */
.btn-primary {
    background: linear-gradient(45deg, #38bdf8, #6366f1);
    border: none;
    font-weight: 600;
}

.btn-primary:hover {
    transform: scale(1.02);
}

/* Checkbox */
.form-check-label {
    color: #cbd5e1;
}

/* Modal */
.modal-content {
    background: #111827;
    color: white;
    border-radius: 12px;
}

</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
<div class="container">

    <a class="navbar-brand" href="index.html">
        Skill<span style="color:#7dd3fc;">Verse</span>
    </a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
            <li class="nav-item"><a class="nav-link active" href="#">Register</a></li>
        </ul>
    </div>

</div>
</nav>

<!-- Form -->
<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="glass-card">

    <h2 class="title">Course Registration</h2>

    <form>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter email">
            </div>

        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Mobile</label>
                <input type="tel" class="form-control" placeholder="Enter mobile number">
            </div>

            <div class="col-md-6 mb-3">
                <label>Gender</label>
                <select class="form-select">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

        </div>

        <div class="mb-3">
            <label>Course</label>
            <select class="form-select">
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Java Programming</option>
                <option>Data Science</option>
                <option>AI & ML</option>
                <option>Cloud Computing</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Qualification</label>
            <select class="form-select">
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>M.Tech</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Address</label>
            <textarea class="form-control" rows="3" placeholder="Enter address"></textarea>
        </div>

        <div class="mb-3">
            <label>Upload Resume</label>
            <input type="file" class="form-control">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
                I agree to terms and conditions
            </label>
        </div>

        <button type="button"
                class="btn btn-primary w-100"
                data-bs-toggle="modal"
                data-bs-target="#successModal">
            Submit Registration
        </button>

    </form>

</div>

</div>

</div>

</div>

<!-- Modal -->
<div class="modal fade" id="successModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header">
        <h5>Registration Successful</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        Your registration has been submitted successfully!
    </div>

    <div class="modal-footer">
        <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
